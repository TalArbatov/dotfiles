# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME




# hyprsplit: local per-monitor workspaces
bind = $mainMod, 1, exec, hyprctl dispatch split:workspace 1
bind = $mainMod, 2, exec, hyprctl dispatch split:workspace 2
bind = $mainMod, 3, exec, hyprctl dispatch split:workspace 3
bind = $mainMod, 4, exec, hyprctl dispatch split:workspace 4
bind = $mainMod, 5, exec, hyprctl dispatch split:workspace 5
bind = $mainMod, 6, exec, hyprctl dispatch split:workspace 6
bind = $mainMod, 7, exec, hyprctl dispatch split:workspace 7
bind = $mainMod, 8, exec, hyprctl dispatch split:workspace 8
bind = $mainMod, 9, exec, hyprctl dispatch split:workspace 9

bind = $mainMod SHIFT, 1, exec, hyprctl dispatch split:movetoworkspacesilent 1
bind = $mainMod SHIFT, 2, exec, hyprctl dispatch split:movetoworkspacesilent 2
bind = $mainMod SHIFT, 3, exec, hyprctl dispatch split:movetoworkspacesilent 3
bind = $mainMod SHIFT, 4, exec, hyprctl dispatch split:movetoworkspacesilent 4
bind = $mainMod SHIFT, 5, exec, hyprctl dispatch split:movetoworkspacesilent 5
bind = $mainMod SHIFT, 6, exec, hyprctl dispatch split:movetoworkspacesilent 6
bind = $mainMod SHIFT, 7, exec, hyprctl dispatch split:movetoworkspacesilent 7
bind = $mainMod SHIFT, 8, exec, hyprctl dispatch split:movetoworkspacesilent 8
bind = $mainMod SHIFT, 9, exec, hyprctl dispatch split:movetoworkspacesilent 9

bind = $mainMod, G, exec, hyprctl dispatch split:grabroguewindows


# TAL - Move focus between screens

bind = $mainMod, comma, focusmonitor, +1
bind = $mainMod, period, focusmonitor, -1

# TAL - Move a window from one monitor to another
bind = $mainMod SHIFT, comma, movewindow, mon:+1
bind = $mainMod SHIFT, period, movewindow, mon:-1


# change language
# SUPER + Z
bind = $mainMod, code:52, exec, $scriptsDir/KeyboardLayout.sh switch

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# TAL TEST - prove UserKeybinds.conf is loaded
bind = SUPER, F12, exec, hyprctl notify -1 2500 "rgb(00ff99)" "SUPER+F12 bind fired"
bind = SUPER, F11, exec, hyprctl switchxkblayout all next
