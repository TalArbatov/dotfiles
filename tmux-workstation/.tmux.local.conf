# Keyboard clipboard overrides.
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Accept clipboard requests from inner tmux over SSH.
set -s set-clipboard on

# Automatically copy mouse selections on release.
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Selection appearance.
set -g copy-mode-selection-style "bg=#444444,fg=default"

# Pane appearance.
set -g pane-border-lines spaces
set -g pane-border-style "bg=default"
set -g pane-active-border-style "bg=default"

# Enter scrollback without forced exit at the live screen.
bind-key -n WheelUpPane if-shell -F \
    '#{||:#{alternate_on},#{||:#{pane_in_mode},#{mouse_any_flag}}}' \
    'send-keys -M' 'copy-mode'

# Exit at the live screen only when no selection is active.
bind-key -T copy-mode-vi WheelDownPane \
    'select-pane; send-keys -X -N 5 scroll-down; if-shell -F "#{&&:#{==:#{scroll_position},0},#{==:#{selection_present},0}}" "send-keys -X cancel"'


set -g @dracula-plugins "cwd ram-usage time"
run-shell '~/.tmux/plugins/tmux/dracula.tmux'
