source-file ~/.config/tmux/linux.conf

# Selection appearance.

# Pane appearance.
set -g pane-border-lines single
set -g pane-border-style "bg=default"
set -g pane-active-border-style "bg=default"


# NAS navigation.
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# Compact NAS status bar.
set -g status-style "bg=#282a36,fg=#bfc5d5"
set -g status-left-length 50
set -g status-right-length 60

set -g status-left "#[bg=#8be9fd,fg=#282a36,bold] NAS #h #[default] #S "
set -g status-right "#[fg=#bfc5d5]#{b:pane_current_path} #[fg=#6272a4]| Ctrl+B "

set -g window-status-separator " "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#44475a,fg=#8be9fd,bold] #I:#W #[default]"

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#8be9fd"
