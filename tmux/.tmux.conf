##### PREFIX #############################################################

# Ctrl-a instead of Ctrl-b.
unbind C-b
set -g prefix C-a

# Ctrl-a Ctrl-a sends a real Ctrl-a to the application.
bind C-a send-prefix


##### GENERAL BEHAVIOR ###################################################

set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -s escape-time 0

# Number windows/panes starting from 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Automatically name windows based on the active application.
setw -g automatic-rename on

# Don't let applications rename tmux windows themselves.
set -g allow-rename off

# Update status bar every 5 seconds.
set -g status-interval 5

# If a session/window disappears, prefer switching rather than detaching.
set -g detach-on-destroy off

# Keep tmux messages visible slightly longer.
set -g display-time 2500


##### KITTY AND COLOR SUPPORT ############################################

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm*:extkeys"

set -g allow-passthrough on

# Important for Claude Code Shift+Enter.
set -s extended-keys always


##### MACOS CLIPBOARD ####################################################

set -s set-clipboard on

setw -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection

bind -T copy-mode-vi y \
    send-keys -X copy-pipe-and-cancel "pbcopy"

bind -T copy-mode-vi Enter \
    send-keys -X copy-pipe-and-cancel "pbcopy"


##### WINDOWS AND PANES ##################################################

# New window in current directory.
bind c new-window -c "#{pane_current_path}"

# Easier splits.
unbind %
unbind '"'

# Ctrl-a |
bind | split-window -h -c "#{pane_current_path}"

# Ctrl-a -
bind - split-window -v -c "#{pane_current_path}"


##### PANE NAVIGATION ####################################################

# Ctrl-a h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl-a H/J/K/L
# Hold key to repeatedly resize.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### WINDOW NAVIGATION ##################################################

# Next / previous tmux window.
bind n next-window
bind p previous-window

# Jump to previously used window.
bind Tab last-window


##### CONFIG #############################################################

# Ctrl-a r reloads this file.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"


##### BACKGROUND ACTIVITY ################################################

# Highlight inactive windows when they produce output.
setw -g monitor-activity on
set -g visual-activity on


##### STATUS BAR #########################################################

set -g status-position bottom
set -g status-justify left


##### DRACULA ############################################################

# Powerline styling.
set -g @dracula-show-powerline true
set -g @dracula-show-edge-icons true
set -g @dracula-transparent-powerline-bg true

# Slightly nicer angled separators.
set -g @dracula-show-left-sep ""
set -g @dracula-show-right-sep ""

# Show window state flags (*, activity, zoom, etc.).
set -g @dracula-show-flags true

# Make the active pane border more obvious.
set -g @dracula-border-contrast true

# Show session name on the far left.
set -g @dracula-show-left-icon "session"

# Hide modules when they have nothing useful to show.
set -g @dracula-show-empty-plugins false

# Information shown on the right.
set -g @dracula-plugins "cwd ram-usage battery time"

# Working directory.
set -g @dracula-cwd-max-dirs "2"
set -g @dracula-cwd-max-chars "30"

# Git.
set -g @dracula-git-show-current-symbol "✓"
set -g @dracula-git-show-diff-symbol "!"
set -g @dracula-git-show-untracked-symbol "?"

# Kubernetes: keep EKS context names readable.
set -g @dracula-kubernetes-hide-user true
set -g @dracula-kubernetes-eks-hide-arn true
set -g @dracula-kubernetes-hide-no-config true
set -g @dracula-kubernetes-context-label "󱃾 "

# CPU / RAM Nerd Font icons.
set -g @dracula-ram-usage-label " "

# Battery.
set -g @dracula-battery-label "󰁹 "

# Clock.
set -g @dracula-military-time true
set -g @dracula-show-timezone false
set -g @dracula-day-month true

# Status refresh.
set -g @dracula-refresh-rate 5


##### PLUGINS ############################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux#v3.2.0'


##### TPM — MUST REMAIN LAST #############################################

run '~/.tmux/plugins/tpm/tpm'


##### specifically for fedora/dwm/kitty

# Direct tmux window switching
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
